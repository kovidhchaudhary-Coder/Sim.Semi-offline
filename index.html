<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behemoth Obsidian</title><style>html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#000}#loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#000;transition:opacity .6s ease}#loader.hide{opacity:0;pointer-events:none}.ring{width:104px;aspect-ratio:1;border-radius:50%;padding:12px;box-sizing:border-box;background:conic-gradient(from 180deg,#ff245a,#ff7a00,#ffd400,#b8ff00,#00ffa8,#00d4ff,#7f5bff,#ff00d4,#ff245a);-webkit-mask:radial-gradient(transparent 60%,#000 61%);mask:radial-gradient(transparent 60%,#000 61%);animation:spin 1.2s linear infinite}#dashboard{position:fixed;right:20px;bottom:20px;width:280px;height:120px;padding:15px;border-radius:0 10px 10px 0;background:rgba(0,0,0,.7);border-left:5px solid #00ff7a;color:#00ff7a;font-family:"Courier New",monospace;z-index:3;box-sizing:border-box}#rpm-track{height:10px;width:100%;background:rgba(255,255,255,.08);margin-bottom:10px;overflow:hidden;border-radius:2px}#rpm-bar{height:10px;width:0%;background:linear-gradient(90deg,#00ff00,#ffff00,#ff0000);transition:width .1s linear}#dashboard.rev #rpm-bar{filter:brightness(1.35)}#dashboard.rev{border-left-color:#ff2b2b;color:#ff4d4d}#speed-display{font-size:45px;font-weight:700;line-height:1}#unit{font-size:14px;opacity:.85}#gear-box{position:absolute;top:15px;right:20px;text-align:right}#gear-mode{font-size:20px;display:block}#gear-num{font-size:60px;display:block;line-height:1}#fps-mini{position:absolute;left:15px;bottom:10px;font-size:12px;opacity:.8}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div id="app"></div><div id="dashboard"><div id="rpm-track"><div id="rpm-bar"></div></div><div id="speed-display">000</div><div id="unit">KM/H</div><div id="gear-box"><span id="gear-mode">A</span><span id="gear-num">1</span></div><div id="fps-mini">FPS:0</div></div><div id="loader"><div class="ring"></div></div><script type="module">import*as T from'https://unpkg.com/three@0.164.1/build/three.module.js';import{OrbitControls as O}from'https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js';import{GLTFLoader as G}from'https://unpkg.com/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';import{RGBELoader as R}from'https://unpkg.com/three@0.164.1/examples/jsm/loaders/RGBELoader.js';const app=document.getElementById('app'),loader=document.getElementById('loader'),dash=document.getElementById('dashboard'),rpmBar=document.getElementById('rpm-bar'),speedEl=document.getElementById('speed-display'),gearModeEl=document.getElementById('gear-mode'),gearNumEl=document.getElementById('gear-num'),fpsEl=document.getElementById('fps-mini'),scene=new T.Scene(),cam=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,1e3),ren=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance',precision:'lowp'}),ctl=new O(cam,ren.domElement),mgr=new T.LoadingManager(),targetPos=new T.Vector3(),targetQuat=new T.Quaternion(),targetEuler=new T.Euler();let car=new T.Object3D(),speed=0,gear=1,rpm=0,shifting=false,steer=0,isManual=false,fps=0,last=performance.now(),wheels={fl:null,fr:null,bl:null,br:null};const ac=new(window.AudioContext||window.webkitAudioContext)(),osc=ac.createOscillator(),amp=ac.createGain();osc.type='sawtooth';osc.frequency.value=80;amp.gain.value=.8;osc.connect(amp).connect(ac.destination);osc.start();const unlock=()=>ac.state!=='running'&&ac.resume();addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});cam.position.set(4,2,8);scene.add(car);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.outputColorSpace=T.SRGBColorSpace;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.2;ren.info.autoReset=true;app.appendChild(ren.domElement);ctl.enableDamping=true;ctl.dampingFactor=.05;mgr.onLoad=()=>{loader.classList.add('hide');setTimeout(()=>loader.remove(),600)};new R(mgr).load('./assets/env_map.hdr',t=>{t.mapping=T.EquirectangularReflectionMapping;scene.environment=t});new G(mgr).load('./assets/behemoth.glb',g=>{const x=g.scene;x.name='Behemoth_Car';x.position.copy(car.position);x.quaternion.copy(car.quaternion);scene.remove(car);car=x;scene.add(car);const an=ren.capabilities.getMaxAnisotropy();const hit=(n,...k)=>k.some(v=>n.includes(v));car.traverse(n=>{if(!n.isMesh)return;n.frustumCulled=true;const nn=(n.name||'').toLowerCase();if(hit(nn,'wheel_fl','front_left','fl_wheel','wheel_lf')||hit(nn,'wheel')&&hit(nn,'front','left'))wheels.fl=n;else if(hit(nn,'wheel_fr','front_right','fr_wheel','wheel_rf')||hit(nn,'wheel')&&hit(nn,'front','right'))wheels.fr=n;else if(hit(nn,'wheel_rl','rear_left','back_left','rl_wheel','wheel_lr')||hit(nn,'wheel')&&hit(nn,'rear','left'))wheels.bl=n;else if(hit(nn,'wheel_rr','rear_right','back_right','rr_wheel')||hit(nn,'wheel')&&hit(nn,'rear','right'))wheels.br=n;const ms=Array.isArray(n.material)?n.material:[n.material];for(const m of ms){if(m&&m.map){m.map.anisotropy=an;m.map.needsUpdate=true}}});T.Cache.clear()});const ws=new WebSocket(`ws://${location.hostname}:8080`);ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}window.ub(d)};const send=t=>ws.readyState===1&&ws.send(JSON.stringify({t}));addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='g'){isManual=!isManual;send('G')}else if(isManual&&(k==='+'||k==='='))send('U');else if(isManual&&k==='-')send('D')});window.ub=d=>{if(!d)return;const p=d.p||d.pos,r=d.r||d.rot;if(p){if(typeof p.x==='number')targetPos.x=p.x;if(typeof p.y==='number')targetPos.y=p.y;if(typeof p.z==='number')targetPos.z=p.z}if(r){if(typeof r.x==='number')targetEuler.x=r.x;if(typeof r.y==='number')targetEuler.y=r.y;if(typeof r.z==='number')targetEuler.z=r.z;targetQuat.setFromEuler(targetEuler)}if(typeof d.v==='number')speed=d.v;if(typeof d.gn==='number')gear=d.gn;if(typeof d.rpm==='number')rpm=d.rpm;if(typeof d.s==='boolean')shifting=d.s;if(typeof d.st==='number')steer=d.st;const spin=speed*.0015;if(wheels.fl){wheels.fl.rotation.y=steer;wheels.fl.rotation.x+=spin}if(wheels.fr){wheels.fr.rotation.y=steer;wheels.fr.rotation.x+=spin}if(wheels.bl)wheels.bl.rotation.x+=spin;if(wheels.br)wheels.br.rotation.x+=spin;const now=ac.currentTime,f=Math.max(80,Math.min(800,rpm/10));osc.frequency.setTargetAtTime(f,now,.02);amp.gain.cancelScheduledValues(now);if(shifting){amp.gain.setTargetAtTime(.01,now,.005);amp.gain.setTargetAtTime(.8,now+.1,.01)}else amp.gain.setTargetAtTime(.8,now,.02)};window.UpdateBehemoth=window.ub;addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});(function loop(t){requestAnimationFrame(loop);car.position.lerp(targetPos,.5);car.quaternion.slerp(targetQuat,.5);ctl.update();ren.render(scene,cam);fps=.92*fps+.08*(1e3/Math.max(1,t-last));last=t;const rs=Math.max(0,Math.min(100,rpm/80));rpmBar.style.width=`${rs}%`;dash.classList.toggle('rev',rpm>7500);speedEl.textContent=String(Math.max(0,Math.round(speed))).padStart(3,'0');gearModeEl.textContent=isManual?'M':'A';gearNumEl.textContent=`${gear}`;fpsEl.textContent=`FPS:${fps.toFixed(1)}`})(last)</script></body></html>
